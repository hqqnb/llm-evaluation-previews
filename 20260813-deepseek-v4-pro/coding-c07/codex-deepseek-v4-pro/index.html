/* ============================== 工具函数 ============================== */

function rng(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function hash32(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

function noise(key, y) {
  return rng((hash32(key) + y * 7919) >>> 0)() * 2 - 1;
}

function covid(y) {
  return y === 2020 ? 0.62 : y === 2021 ? 0.75 : 1;
}

function countryValue(id, m, y) {
  const c = countryById.get(id);
  if (!c) return 0;
  const n = noise(id + ':' + m, y);
  if (m === 'gdp') return Math.max(0, c.gdp * Math.pow(1 + c.g, y - 2024) * (1 + 0.05 * n));
  if (m === 'pop') return Math.max(0, c.pop * Math.pow(1.008, y - 2024) * (1 + 0.02 * n));
  return Math.max(0, c.fl * Math.pow(1.045, y - 2024) * covid(y) * (1 + 0.08 * n));
}

function cityValue(c, m, y) {
  const n = noise(c.n + ':' + m, y);
  if (m === 'pop') return Math.max(0, c.pop * Math.pow(1.012, y - 2024) * (1 + 0.02 * n));
  if (m === 'flights') return Math.max(0, c.fl * Math.pow(1.04, y - 2024) * covid(y) * (1 + 0.07 * n));
  const cg = countryValue(c.cid, 'gdp', y);
  const cp = countryValue(c.cid, 'pop', y);
  const cpop = cityValue(c, 'pop', y);
  return Math.min(cg * 0.45, cg * (cpop / cp) * 2.1);
}

function routeValue(r, y) {
  return Math.max(0, r.v * Math.pow(1.04, y - 2024) * covid(y) * (1 + 0.08 * noise(r.a + '-' + r.b, y)));
}

function logScale(vals) {
  const pos = vals.filter((v) => v > 0);
  const mn = Math.min(...pos);
  const mx = Math.max(...pos);
  const span = Math.log(mx) - Math.log(mn) || 1;
  return {
    min: mn, max: mx,
    t: (v) => v <= 0 ? 0 : Math.min(1, Math.max(0, (Math.log(v) - Math.log(mn)) / span))
  };
}

const RAMP = [

];

function rampColor(t) {
  t = Math.min(1, Math.max(0, t));
  for (let i = 1; i < RAMP.length; i++) {
    if (t <= RAMP[i][0]) {
      const a = RAMP[i - 1], b = RAMP[i];
      const k = (b[0] === a[0]) ? 0 : (t - a[0]) / (b[0] - a[0]);
      return {
        r: Math.round(a[1] + (b[1] - a[1]) * k),
        g: Math.round(a[2] + (b[2] - a[2]) * k),
        b: Math.round(a[3] + (b[3] - a[3]) * k)
      };
    }
  }
  const last = RAMP[RAMP.length - 1];
  return { r: last[1], g: last[2], b: last[3] };
}

function threeColor(t) {
  const c = rampColor(t);
  return new THREE.Color(c.r / 255, c.g / 255, c.b / 255);
}

function fmtPop(v) {

function fmtFlights(v) {

    varying vec3 vNormal;

    const c = rampColor(t);

    ctx.strokeStyle = 'rgba(255,255,255,0.10)';
    ctx.beginPath();
    const polys = f.geometry.type === 'MultiPolygon' ? f.geometry.coordinates : [f.geometry.coordinates];
    for (const poly of polys) {
      for (const ring of poly) {
        ring.forEach(([lon, lat], i) => {
          const x = (lon + 180) / 360 * W;
          const y = (90 - lat) / 180 * H;
          if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y);
        });
        ctx.closePath();
      }
    }
    ctx.fill('evenodd');
    ctx.stroke();
  }
  heatTexture.needsUpdate = true;
}

function loadTextureCandidates(urls) {
  return new Promise((resolve) => {
    let i = 0;
    const next = () => {
      if (i >= urls.length) return resolve(null);
      const url = urls[i++];
      texLoader.load(url, (tex) => {
        tex.colorSpace = THREE.NoColorSpace;
        tex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
        resolve(tex);
      }, undefined, next);
    };
    next();
  });
}

// 离线兜底：按国家多边形绘制陆地的日间纹理
function makeFallbackDay() {
  const W = 2048, H = 1024;
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#123a72');
  grad.addColorStop(0.5, '#174a8c');
  grad.addColorStop(1, '#0f3065');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  const drawLand = (polys) => {
    ctx.beginPath();
    for (const poly of polys) {
      for (const ring of poly) {
        ring.forEach(([lon, lat], i) => {
          const x = (lon + 180) / 360 * W;
          const y = (90 - lat) / 180 * H;
          if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y);
        });
        ctx.closePath();
      }
    }
    ctx.fillStyle = '#3f7d4b';
    ctx.fill('evenodd');
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  };

  if (state.geo) {
    for (const f of state.geo.features) {
      const polys = f.geometry.type === 'MultiPolygon' ? f.geometry.coordinates : [f.geometry.coordinates];
      drawLand(polys);
    }
  } else {
    const blobs = [
      [-100, 52, 30, 15], [-85, 42, 22, 12], [-70, 55, 12, 10], [-40, 72, 10, 9],
      [-60, -12, 18, 18], [-63, -28, 13, 14], [-70, -45, 7, 9],
      [20, 8, 20, 25], [24, -10, 15, 18], [28, -25, 12, 12], [-8, 0, 8, 8],
      [48, 25, 25, 10], [15, 52, 30, 12], [55, 55, 35, 10], [80, 60, 35, 12],
      [100, 60, 28, 10], [90, 35, 22, 10], [105, 30, 22, 8], [115, 22, 15, 8],
      [100, 10, 12, 7], [135, -25, 15, 10], [150, -20, 8, 6]
    ];
    ctx.fillStyle = '#3f7d4b';
    for (const [lon, lat, rx, ry] of blobs) {
      ctx.beginPath();
      ctx.ellipse((lon + 180) / 360 * W, (90 - lat) / 180 * H, rx / 360 * W, ry / 180 * H, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // 噪点纹理与极地冰盖
  const rnd = rng(12345);
  for (let i = 0; i < 9000; i++) {
    const x = rnd() * W, y = rnd() * H;
    ctx.fillStyle = `rgba(255,255,255,${0.01 + rnd() * 0.025})`;
    ctx.fillRect(x, y, 2, 2);
  }
  ctx.fillStyle = 'rgba(240,247,255,0.92)';
  ctx.beginPath(); ctx.ellipse(W / 2, 6, 520, 70, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(W / 2, H - 6, 520, 60, 0, 0, Math.PI * 2); ctx.fill();

  return new THREE.CanvasTexture(cv);
}

// 离线兜底：城市灯光夜景纹理
function makeFallbackNight() {
  const W = 2048, H = 1024;
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#000000';
  ctx.fillRect(0, 0, W, H);
  for (const c of CITIES) {
    const x = (c.lon + 180) / 360 * W;
    const y = (90 - c.lat) / 180 * H;
    const rr = (8 + Math.sqrt(c.pop) * 6) * (W / 2048);
    const g = ctx.createRadialGradient(x, y, 0, x, y, rr);
    g.addColorStop(0, 'rgba(255,225,170,0.95)');
    g.addColorStop(0.35, 'rgba(255,190,110,0.45)');
    g.addColorStop(1, 'rgba(255,160,80,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, rr, 0, Math.PI * 2);
    ctx.fill();
  }
  const rnd = rng(54321);
  for (let i = 0; i < 2400; i++) {
    const x = rnd() * W, y = rnd() * H;
    ctx.fillStyle = `rgba(255,${200 + Math.floor(rnd() * 55)},${130 + Math.floor(rnd() * 90)},${0.12 + rnd() * 0.2})`;
    ctx.fillRect(x, y, 1.5, 1.5);
  }
  return new THREE.CanvasTexture(cv);
}

function computeYearState() {
  const m = state.metric;
  const y = state.year;

  const countryVals = COUNTRIES.map((c) => countryValue(c[0], m, y));
  const cs = logScale(countryVals);
  state.countryT = new Map(COUNTRIES.map((c, i) => [c[0], cs.t(countryVals[i])]));
  state.legend = [cs.min, cs.max];

  const cityVals = CITIES.map((c) => cityValue(c, m, y));
  const ms = logScale(cityVals);
  state.markerT = cityVals.map((v) => ms.t(v));

  const routeVals = ROUTES.map((r) => routeValue(r, y));
  const rs = logScale(routeVals);
  state.routeT = routeVals.map((v) => rs.t(v));
}

function coreScale(t) {
  return 0.014 + 0.034 * t;
}

function applyState() {
  // 城市标记
  CITIES.forEach((city, i) => {
    const t = state.markerT[i];
    const col = threeColor(t);
    const core = coreSprites[i];
    const halo = haloSprites[i];
    const selected = i === state.openCity;
    core.material.color.copy(selected ? new THREE.Color(1, 1, 1) : col);
    halo.material.color.copy(selected ? new THREE.Color(1, 1, 1) : col);
    const s = coreScale(t) * (selected ? 1.35 : 1);
    core.scale.setScalar(s);
    halo.scale.setScalar(s * 4.2);
    halo.material.opacity = selected ? 0.8 : (0.18 + 0.42 * t);
  });

  // 航线颜色与亮度
  arcMaterials.forEach((mat, i) => {
    const t = state.routeT[i];
    const col = threeColor(t);
    mat.uniforms.uColor.value = col;
    mat.uniforms.uOpacity.value = 0.3 + 0.62 * t;
  });
  if (state.hoverRoute >= 0) {
    arcMaterials[state.hoverRoute].uniforms.uOpacity.value *= 1.35;
  }

  // 图例
  $('legendMin').textContent = fmtValue(state.legend[0], state.metric);
  $('legendMax').textContent = fmtValue(state.legend[1], state.metric);
  $('legendMetric').textContent = METRIC_LABEL[state.metric] + '（' + METRIC_UNIT[state.metric] + '）';

  heatPending = true;
  if (state.openCity >= 0) renderPopup();
  if (state.hoverRoute >= 0) updateTooltip();
}

function renderPopup() {
  const i = state.openCity;
  const c = CITIES[i];
  const m = state.metric;
  const vals = YEARS.map((y) => cityValue(c, m, y));
  let mn = Infinity, mx = -Infinity;
  vals.forEach((v) => { mn = Math.min(mn, v); mx = Math.max(mx, v); });
  const span = (mx - mn) || 1;
  const pts = vals.map((v, k) => {
    const x = (k / (vals.length - 1) * 216).toFixed(1);
    const yy = (52 - (v - mn) / span * 44).toFixed(1);
    return `${x},${yy}`;
  });
  const path = 'M' + pts.join(' L');
  const country = countryById.get(c.cid);

  $('popup').innerHTML = `
    <button class="close" title="关闭">×</button>
    <div class="p-title">${c.n}</div>
    <div class="p-sub">${country ? country.zh : ''} · ${state.year} 年 · ${c.en}</div>
    <div class="p-main">
      <div class="p-main-v">${fmtValue(cityValue(c, m, state.year), m)}</div>
      <div class="p-main-k">${METRIC_LABEL[m]}</div>
    </div>
    <svg class="p-chart" viewBox="0 0 216 56" preserveAspectRatio="none">
      <line x1="0" y1="52" x2="216" y2="52" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
      <path d="${path} L216,52 L0,52 Z" fill="rgba(77,163,255,0.15)" stroke="none"/>
      <polyline points="${pts.join(' ')}" fill="none" stroke="#4da3ff" stroke-width="1.5"/>
    </svg>
    <div class="p-chart-label">2010 — 2025 · ${METRIC_LABEL[m]}变化趋势</div>
    <div class="p-rows">
      <div><span>人口</span><b>${fmtPop(cityValue(c, 'pop', state.year))}</b></div>
      <div><span>年航班量</span><b>${fmtFlights(cityValue(c, 'flights', state.year))}</b></div>
      <div><span>GDP（城市估算）</span><b>${fmtGdp(cityValue(c, 'gdp', state.year))}</b></div>
    </div>
  `;
  $('popup').style.display = 'block';
  positionPopup();
}

function positionPopup() {
  const el = $('popup');
  const i = state.openCity;
  if (i < 0) return;
  const world = latLonToVec3(CITIES[i].lat, CITIES[i].lon, 1.02).applyMatrix4(globeGroup.matrixWorld);
  const v = world.project(camera);
  if (v.z > 1) { el.style.visibility = 'hidden'; return; }
  el.style.visibility = 'visible';
  const w = window.innerWidth, h = window.innerHeight;
  let x = (v.x * 0.5 + 0.5) * w;
  let y = (-v.y * 0.5 + 0.5) * h;
  const pw = el.offsetWidth || 280;
  const ph = el.offsetHeight || 300;
  const minLeft = w > 640 ? 300 : 16;
  x = Math.min(Math.max(x - pw / 2, minLeft), w - pw - 16);
  y = Math.min(Math.max(y - ph - 18, 16), h - ph - 16);
  el.style.left = x + 'px';
  el.style.top = y + 'px';
}

function openPopup(i) {
  state.openCity = i;
  applyState();
}

function closePopup() {
  state.openCity = -1;
  $('popup').style.display = 'none';
  applyState();
}

$('popup').addEventListener('click', (e) => {
  if (e.target.closest('.close')) closePopup();
});

/* ============================== 航线提示 ============================== */

function updateTooltip() {
  const idx = state.hoverRoute;
  const tip = $('tooltip');
  if (idx < 0) { tip.style.display = 'none'; return; }
  const r = ROUTES[idx];
  tip.innerHTML = `
    <div class="tt-route">✈ ${CITIES[r.a].n} ⇄ ${CITIES[r.b].n}</div>
    <div class="tt-meta">年航班量：${fmtFlights(routeValue(r, state.year))}</div>
    <div class="tt-meta">${state.year} 年 · 移动鼠标查看其它航线</div>
  `;
  tip.style.display = 'block';
}

/* ============================== 交互 ============================== */

let downX = 0, downY = 0, moved = 0;
const mouse = { x: 0, y: 0 };

function setPointer(ev) {
  pointer.x = (ev.clientX / window.innerWidth) * 2 - 1;
  pointer.y = -(ev.clientY / window.innerHeight) * 2 + 1;
}

function pickCity() {
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(coreSprites, false);
  return hits.length ? hits[0].object.userData.i : -1;
}

function pickRoute() {
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(arcsGroup.children, false);
  return hits.length ? hits[0].object.userData.idx : -1;
}

renderer.domElement.addEventListener('pointerdown', (e) => {
  downX = e.clientX; downY = e.clientY; moved = 0;
});

window.addEventListener('pointermove', (e) => {
  moved += Math.abs(e.clientX - downX) + Math.abs(e.clientY - downY);
  downX = e.clientX; downY = e.clientY;
  mouse.x = e.clientX; mouse.y = e.clientY;
  setPointer(e);

  const ri = pickRoute();
  const ci = pickCity();

  if (ri !== state.hoverRoute) {
    const prev = state.hoverRoute;
    state.hoverRoute = ri;
    if (prev >= 0) arcMaterials[prev].uniforms.uOpacity.value = 0.3 + 0.62 * state.routeT[prev];
    if (ri >= 0) arcMaterials[ri].uniforms.uOpacity.value = (0.3 + 0.62 * state.routeT[ri]) * 1.35;
    updateTooltip();
  }

  const inCanvas = e.target === renderer.domElement;
  renderer.domElement.style.cursor = inCanvas && (ci >= 0 || ri >= 0) ? 'pointer' : 'grab';

  if (ri >= 0) {
    const tip = $('tooltip');
    tip.style.left = Math.min(mouse.x + 14, window.innerWidth - 250) + 'px';
    tip.style.top = (mouse.y + 16) + 'px';
  }
});

window.addEventListener('pointerup', (e) => {
  if (moved > 7) return;
  setPointer(e);
  const ci = pickCity();
  if (ci >= 0) openPopup(ci);
  else closePopup();
});

window.addEventListener('pointerleave', () => {
  if (state.hoverRoute !== -1) {
    const prev = state.hoverRoute;
    state.hoverRoute = -1;
    arcMaterials[prev].uniforms.uOpacity.value = 0.3 + 0.62 * state.routeT[prev];
    updateTooltip();
  }
});

/* ============================== 控制面板 ============================== */

function setMetric(m) {
  if (state.metric === m) return;
  state.metric = m;
  document.querySelectorAll('.metric-btns button').forEach((b) => {
    b.classList.toggle('active', b.dataset.metric === m);
  });
  computeYearState();
  applyState();
}

function setYear(y) {
  state.year = Math.min(2025, Math.max(2010, y));
  $('yearSlider').value = state.year;
  $('yearLabel').textContent = state.year;
  computeYearState();
  applyState();
}

document.querySelectorAll('.metric-btns button').forEach((b) => {
  b.addEventListener('click', () => setMetric(b.dataset.metric));
});

$('yearSlider').addEventListener('input', (e) => setYear(Number(e.target.value)));

$('playBtn').addEventListener('click', () => {
  state.playing = !state.playing;
  const btn = $('playBtn');
  btn.textContent = state.playing ? '⏸' : '▶';
  btn.classList.toggle('playing', state.playing);
});

$('tgRotate').addEventListener('change', (e) => { state.autoRotate = e.target.checked; });
$('tgAtmo').addEventListener('change', (e) => { glow.visible = e.target.checked; });
$('tgHeat').addEventListener('change', (e) => { if (heatMesh) heatMesh.visible = e.target.checked; });
$('tgNight').addEventListener('change', (e) => { earthUniforms.uShowNight.value = e.target.checked ? 1 : 0; });
$('tgArcs').addEventListener('change', (e) => { arcsGroup.visible = e.target.checked; });
$('tgLabels').addEventListener('change', (e) => { labelsGroup.visible = e.target.checked; });

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ============================== 渲染循环 ============================== */

const SMOKE = new URLSearchParams(location.search).has('smoke');
let frameCount = 0;

function animate() {
  const dt = Math.min(clock.getDelta(), 0.1);
  elapsed += dt;

  if (state.autoRotate) globeGroup.rotation.y += dt * 0.05;

  if (state.playing) {
    playAcc += dt;
    if (playAcc > 0.8) {
      playAcc = 0;
      setYear(state.year >= 2025 ? 2010 : state.year + 1);
    }
  }

  for (const mat of arcMaterials) mat.uniforms.uTime.value = elapsed;

  // 标记呼吸脉冲
  CITIES.forEach((city, i) => {
    const t = state.markerT[i];
    const s = coreScale(t) * (i === state.openCity ? 1.35 : 1);
    const pulse = 1 + 0.1 * Math.sin(elapsed * 2.2 + i * 1.7);
    haloSprites[i].scale.setScalar(s * 4.2 * pulse);
  });

  if (heatPending) {
    heatPending = false;
    redrawHeat();
  }

  controls.update();
  if (state.openCity >= 0) positionPopup();
  renderer.render(scene, camera);

  if (SMOKE && ++frameCount >= 30) {
    document.body.dataset.ready = '1';
    return;
  }
  requestAnimationFrame(animate);
}

/* ============================== 启动 ============================== */

computeYearState();
applyState();
initTextures();
initTopo();
animate();
</script>
</body>
</html>
