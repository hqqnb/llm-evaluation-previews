html &gt; body {

    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))

}

b,
strong,
th {

}

  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);

  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;

  left: 0;

  background: var(--popover);

  height: 1px;

    { name: &quot;巴塔哥尼亚&quot;, en: &quot;Patagonia&quot;, ground: 0x8a8158, tree: 0x4d6b3c, trees: 8, water: true, sun: 0xf0e6c8, desc: &quot;山地草原&quot; },
    { name: &quot;牧场&quot;, en: &quot;rangeland&quot;, ground: 0x9fa05a, tree: 0x55733f, trees: 4, animals: true, town: true, sun: 0xffe1a2, desc: &quot;牧场草原（生态区类型舱段）&quot; },
  ];

  const hullMeshes = [];
  const biomeGroups = { A: [], B: [] };
  const spokeGroups = { A: [], B: [] };
  const cabinMeshes = [];
  const AI_PARTICLES = [];

  function randRange(a, b) { return a + Math.random() * (b - a); }

  function buildBiome(group, def, ring, index) {
    group.userData = { biome: true, ring, index, def };

    const hullMat = HULL_MAT_PROTO.clone();
    hullMat.emissive = new THREE.Color(0x06090f);
    const hull = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 4, 48, 1, false), hullMat);
    hull.userData = { pick: &quot;biome&quot;, ring, index, def };
    group.add(hull);
    hullMeshes.push(hull);

    // 内壁弧面地形（约占下半 120°）
    const ground = new THREE.Mesh(
      new THREE.CylinderGeometry(0.46, 0.46, 4, 40, 1, true, Math.PI - 1.05, 2.1),
      new THREE.MeshStandardMaterial({ color: def.ground, metalness: 0, roughness: 0.95, side: THREE.DoubleSide })
    );
    group.add(ground);

    // 湖泊 / 河流
    if (def.water) {
      const water = new THREE.Mesh(
        new THREE.CylinderGeometry(0.455, 0.455, 4, 24, 1, true, Math.PI - 0.4, 0.8),
        new THREE.MeshStandardMaterial({
          color: 0x2b6e9e, metalness: 0.05, roughness: 0.12,
          transparent: true, opacity: 0.86, side: THREE.DoubleSide, depthWrite: false
        })
      );
      group.add(water);
    }

    // 太阳管线（沿轴线的“阳光”）
    const sunline = new THREE.Mesh(
      new THREE.CylinderGeometry(0.045, 0.045, 3.94, 16),
      new THREE.MeshBasicMaterial({ color: def.sun })
    );
    group.add(sunline);
    const sunGlow = makeSprite(GLOW_TEX, 1.1, 1.1);
    sunGlow.material.color.set(def.sun);
    sunGlow.material.opacity = 0.55;
    sunGlow.material.blending = THREE.AdditiveBlending;
    sunGlow.position.y = 1.9;
    group.add(sunGlow);

    // 起伏的丘陵
    for (let i = 0; i &lt; 12; i++) {
      const th = Math.PI + randRange(-0.95, 0.95);
      const y = randRange(-1.9, 1.9);
      const hill = new THREE.Mesh(
        new THREE.SphereGeometry(randRange(0.025, 0.07), 8, 6),
        new THREE.MeshStandardMaterial({ color: def.ground, roughness: 1 })
      );
      hill.position.set(Math.sin(th) * 0.455, y, Math.cos(th) * 0.455);
      hill.scale.set(1, 0.42, 1);
      group.add(hill);
    }
    if (def.snow) {
      for (let i = 0; i &lt; 14; i++) {
        const th = Math.PI + randRange(-1.0, 1.0);
        const y = randRange(-1.9, 1.9);
        const patch = new THREE.Mesh(
          new THREE.SphereGeometry(randRange(0.02, 0.05), 8, 6),
          new THREE.MeshStandardMaterial({ color: 0xf4f9fc, roughness: 0.9 })
        );
        patch.position.set(Math.sin(th) * 0.455, y, Math.cos(th) * 0.455);
        patch.scale.set(1.25, 0.35, 1.25);
        group.add(patch);
      }
    }

    // 树木（实例化）
    const treeCount = def.trees || 0;
    if (treeCount &gt; 0) {
      const foliage = new THREE.InstancedMesh(
        new THREE.ConeGeometry(0.012, 0.028, 6),
        new THREE.MeshStandardMaterial({ color: def.tree || 0x3f7040, roughness: 0.9 }),
        treeCount
      );
      const trunks = new THREE.InstancedMesh(
        new THREE.CylinderGeometry(0.0018, 0.0024, 0.01, 5),
        new THREE.MeshStandardMaterial({ color: 0x4a3524, roughness: 1 }),
        treeCount
      );
      const m = new THREE.Matrix4();
      const q = new THREE.Quaternion();
      const up = new THREE.Vector3();
      const s = new THREE.Vector3();
      const p = new THREE.Vector3();
      const Y = new THREE.Vector3(0, 1, 0);
      for (let i = 0; i &lt; treeCount; i++) {
        const th = Math.PI + randRange(-1.0, 1.0);
        if (def.water &amp;&amp; Math.abs(th - Math.PI) &lt; 0.42) { i--; continue; }
        p.set(Math.sin(th) * 0.452, randRange(-1.88, 1.88), Math.cos(th) * 0.452);
        up.set(Math.sin(th), 0, Math.cos(th)).normalize();
        q.setFromUnitVectors(Y, up);
        const sc = randRange(0.7, 1.6);
        s.set(sc, sc, sc);
        m.compose(p, q, s);
        foliage.setMatrixAt(i, m);
        trunks.setMatrixAt(i, m);
        if (def.tree2 &amp;&amp; Math.random() &lt; 0.45) {
          foliage.setColorAt(i, new THREE.Color(def.tree2));
        } else {
          foliage.setColorAt(i, new THREE.Color(def.tree));
        }
      }
      foliage.instanceMatrix.needsUpdate = true;
      if (foliage.instanceColor) foliage.instanceColor.needsUpdate = true;
      trunks.instanceMatrix.needsUpdate = true;
      group.add(foliage);
      group.add(trunks);
    }

    // 房屋与灯火
    if (def.town) {
      const houses = new THREE.InstancedMesh(
        new THREE.BoxGeometry(0.014, 0.012, 0.02),
        new THREE.MeshStandardMaterial({ color: def.name === &quot;蒙古&quot; ? 0xe8e2d0 : 0xd8cfb8, roughness: 0.9 }),
        26
      );
      const windows = new THREE.InstancedMesh(
        new THREE.BoxGeometry(0.003, 0.0025, 0.0025),
        new THREE.MeshBasicMaterial({ color: 0xffd98a }),
        26
      );
      const m = new THREE.Matrix4();
      const q = new THREE.Quaternion();
      const up = new THREE.Vector3();
      const s = new THREE.Vector3(1, 1, 1);
      const p = new THREE.Vector3();
      const Y = new THREE.Vector3(0, 1, 0);
      for (let i = 0; i &lt; 26; i++) {
        const th = Math.PI + randRange(-0.9, 0.9);
        const y = randRange(-1.85, 1.85);
        p.set(Math.sin(th) * 0.452, y, Math.cos(th) * 0.452);
        up.set(Math.sin(th), 0, Math.cos(th)).normalize();
        q.setFromUnitVectors(Y, up);
        m.compose(p, q, s);
        houses.setMatrixAt(i, m);
        windows.setMatrixAt(i, m.clone().multiply(new THREE.Matrix4().makeTranslation(0, 0.0085, 0)));
      }
      houses.instanceMatrix.needsUpdate = true;
      windows.instanceMatrix.needsUpdate = true;
      group.add(houses);
      group.add(windows);
    }

    // 帆船（长池）
    if (def.boats) {
      const sails = new THREE.InstancedMesh(
        new THREE.ConeGeometry(0.0028, 0.008, 4),
        new THREE.MeshStandardMaterial({ color: 0xf2f4f6, roughness: 0.6 }),
        7
      );
      const hulls = new THREE.InstancedMesh(
        new THREE.BoxGeometry(0.0016, 0.001, 0.006),
        new THREE.MeshStandardMaterial({ color: 0x8a5a3a, roughness: 0.8 }),
        7
      );
      const m = new THREE.Matrix4();
      const q = new THREE.Quaternion();
      const up = new THREE.Vector3();
      const s = new THREE.Vector3(1, 1, 1);
      const p = new THREE.Vector3();
      const Y = new THREE.Vector3(0, 1, 0);
      for (let i = 0; i &lt; 7; i++) {
        p.set(randRange(-0.2, 0.2), randRange(-1.7, 1.7), -0.45);
        up.set(0, 0, -1);
        q.setFromUnitVectors(Y, up);
        m.compose(p, q, s);
        sails.setMatrixAt(i, m);
        hulls.setMatrixAt(i, m);
      }
      sails.instanceMatrix.needsUpdate = true;
      hulls.instanceMatrix.needsUpdate = true;
      group.add(sails);
      group.add(hulls);
    }

    // 放牧的畜群
    if (def.animals) {
      const herd = new THREE.InstancedMesh(
        new THREE.SphereGeometry(0.002, 6, 5),
        new THREE.MeshStandardMaterial({ color: 0xe9e6da, roughness: 1 }),
        22
      );
      const m = new THREE.Matrix4();
      const p = new THREE.Vector3();
      for (let i = 0; i &lt; 22; i++) {
        const th = Math.PI + randRange(-0.85, 0.85);
        p.set(Math.sin(th) * 0.452, randRange(-1.85, 1.85), Math.cos(th) * 0.452);
        m.setPosition(p);
        herd.setMatrixAt(i, m);
      }
      herd.instanceMatrix.needsUpdate = true;
      group.add(herd);
    }

    // 端部舱门（15° 斜切锁门）
    for (const sgn of [1, -1]) {
      const hatch = new THREE.Mesh(
        new THREE.CircleGeometry(0.44, 32),
        new THREE.MeshBasicMaterial({ color: def.sun, transparent: true, opacity: 0.5, side: THREE.DoubleSide, depthWrite: false })
      );
      hatch.position.y = sgn * 2.01;
      hatch.rotation.x = Math.PI / 2 + sgn * 0.26;
      group.add(hatch);
    }
  }

  function buildRing(ringId, defs, spinSign, spokeOffsetDeg, zCenter) {
    const ring = new THREE.Group();
    ring.position.z = zCenter;
    ring.userData = { ringId, spinSign };
    ship.add(ring);

    for (let i = 0; i &lt; 12; i++) {
      const phi = THREE.MathUtils.degToRad(i * 30);
      const c = Math.cos(phi), s = Math.sin(phi);
      const T = new THREE.Vector3(-s, c, 0);
      const O = new THREE.Vector3(c, s, 0);
      const g = new THREE.Group();
      g.position.set(RING_R * c, RING_R * s, 0);
      g.quaternion.setFromRotationMatrix(
        new THREE.Matrix4().makeBasis(
          new THREE.Vector3(0, 0, 1),
          T,
          new THREE.Vector3(-c, -s, 0)
        )
      );
      ring.add(g);
      biomeGroups[ringId].push(g);
      buildBiome(g, defs[i], ringId, i);
    }

    // 舱段之间的锁门节点
    for (let i = 0; i &lt; 12; i++) {
      const phi = THREE.MathUtils.degToRad(i * 30 + 15);
      const c = Math.cos(phi), s = Math.sin(phi);
      const node = new THREE.Group();
      node.position.set(RING_R * c, RING_R * s, 0);
      node.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), new THREE.Vector3(-s, c, 0));
      const box = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.85, 0.32), METAL);
      node.add(box);
      ring.add(node);

      let lockName = null;
      let ringColors = [0x67a0e8];
      if (ringId === &quot;A&quot;) {
        if (i === 4) { lockName = &quot;俄罗斯轮盘赌&quot;; ringColors = [0x4a7be8, 0xe05050, 0xf0c040]; }
        else if (i === 3) { lockName = &quot;基辅大门&quot;; ringColors = [0xf0c040, 0xc8ccd4]; }
      }
      ringColors.forEach((col, k) =&gt; {
        const r = new THREE.Mesh(new THREE.TorusGeometry(0.17, 0.013, 6, 28),
          new THREE.MeshBasicMaterial({ color: col }));
        r.position.y = -0.22 + k * 0.2;
        node.add(r);
      });
      if (lockName) {
        const sp = makeSprite(labelTexture(lockName, null, &quot;#dff0ff&quot;), 1.7, 0.42);
        sp.position.y = 0.62;
        node.add(sp);
      }
    }

    // 辐条与内锁定环
    for (let k = 0; k &lt; 6; k++) {
      const phi = THREE.MathUtils.degToRad(k * 60 + spokeOffsetDeg);
      const c = Math.cos(phi), s = Math.sin(phi);
      const O = new THREE.Vector3(c, s, 0);
      const T = new THREE.Vector3(-s, c, 0);
      const spoke = new THREE.Group();
      spoke.quaternion.setFromRotationMatrix(
        new THREE.Matrix4().makeBasis(
          new THREE.Vector3(0, 0, 1),
          O,
          T
        )
      );
      spoke.position.set(0.34 * c, 0.34 * s, 0);
      ring.add(spoke);
      spokeGroups[ringId].push(spoke);

      const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.075, 7.05, 14, 1, true),
        new THREE.MeshStandardMaterial({ color: 0x4a5360, metalness: 0.8, roughness: 0.4, side: THREE.DoubleSide }));
      shaft.position.y = 3.52;
      spoke.add(shaft);
      const glowLine = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 6.95, 8),
        new THREE.MeshBasicMaterial({ color: 0x7fc4ff, transparent: true, opacity: 0.55 }));
      glowLine.position.y = 3.52;
      spoke.add(glowLine);
      for (let h = 0; h &lt; 9; h++) {
        const hoop = new THREE.Mesh(new THREE.TorusGeometry(0.078, 0.004, 5, 20), DARK_METAL);
        hoop.position.y = 0.65 + h * 0.75;
        spoke.add(hoop);
      }
      // 电梯轿厢
      const cabin = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.16, 0.1),
        new THREE.MeshStandardMaterial({ color: 0x8b96a6, metalness: 0.7, roughness: 0.4 }));
      cabin.position.y = 3.5;
      const cabinWin = new THREE.Mesh(new THREE.BoxGeometry(0.004, 0.08, 0.06),
        new THREE.MeshBasicMaterial({ color: 0xffe2a0 }));
      cabinWin.position.set(0.052, 0, 0);
      cabin.add(cabinWin);
      spoke.add(cabin);
      cabin.userData = { phase: k * 1.13, dir: k % 2 ? 1 : -1 };
      cabinMeshes.push(cabin);
    }

    const lockRing = new THREE.Mesh(new THREE.TorusGeometry(3.85, 0.028, 8, 72), DARK_METAL);
    ring.add(lockRing);
  }

  buildRing(&quot;A&quot;, RING_A_DEFS, 1, 0, RING_Z);
  buildRing(&quot;B&quot;, RING_B_DEFS, -1, 30, -RING_Z);

  // 生态舱名称标签
  function attachLabels(defs, ringId) {
    for (let i = 0; i &lt; 12; i++) {
      const phi = THREE.MathUtils.degToRad(i * 30 + 15);
      const c = Math.cos(phi), s = Math.sin(phi);
      const sp = makeSprite(labelTexture(defs[i].name, defs[i].en, &quot;#eef3ff&quot;), 2.2, 0.62);
      sp.position.set((RING_R + 0.62) * c, (RING_R + 0.62) * s, 0);
      biomeGroups[ringId][i].parent.add(sp);
    }
  }
  attachLabels(RING_A_DEFS, &quot;A&quot;);
  attachLabels(RING_B_DEFS, &quot;B&quot;);

  // AI 核心上升粒子
  const aiParticleGeo = new THREE.BufferGeometry();
  const aiParticlePos = new Float32Array(120 * 3);
  for (let i = 0; i &lt; 120; i++) {
    const a = Math.random() * Math.PI * 2;
    const r = 0.02 + Math.random() * 0.06;
    aiParticlePos[i * 3] = Math.cos(a) * r;
    aiParticlePos[i * 3 + 1] = (Math.random() - 0.5) * 1.0;
    aiParticlePos[i * 3 + 2] = Math.sin(a) * r;
  }
  aiParticleGeo.setAttribute(&quot;position&quot;, new THREE.BufferAttribute(aiParticlePos, 3));
  const aiParticles = new THREE.Points(aiParticleGeo, new THREE.PointsMaterial({
    color: 0x6fe8ff, size: 0.006, transparent: true, opacity: 0.8,
    blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true
  }));
  spine.add(aiParticles);
  AI_PARTICLES.push(aiParticles);

  // ---------- 内部探索地点 ----------
  const INTERIOR = [
    { id: &quot;bridge&quot;, label: &quot;舰桥&quot;, kind: &quot;spine&quot;, pos: [0, 0.1, 4.52], target: [0, 0.12, 4.1] },
    { id: &quot;ai&quot;, label: &quot;飞船 AI 核心&quot;, kind: &quot;spine&quot;, pos: [0.17, 0.05, 0.15], target: [0, 0.05, 0] },
    { id: &quot;algae&quot;, label: &quot;藻类实验室&quot;, kind: &quot;spine&quot;, pos: [0.15, 0.03, -3.5], target: [0, 0.02, -3.4] },
    { id: &quot;spokeA&quot;, label: &quot;辐条电梯 · A 环&quot;, kind: &quot;spoke&quot;, ring: &quot;A&quot;, k: 0, y: 3.4 },
    { id: &quot;spokeB&quot;, label: &quot;辐条电梯 · B 环&quot;, kind: &quot;spoke&quot;, ring: &quot;B&quot;, k: 2, y: 3.4 },
    { id: &quot;biome-A-4&quot;, label: &quot;蒙古草原&quot;, kind: &quot;biome&quot;, ring: &quot;A&quot;, index: 4 },
    { id: &quot;biome-A-2&quot;, label: &quot;西伯利亚泰加林&quot;, kind: &quot;biome&quot;, ring: &quot;A&quot;, index: 2 },
    { id: &quot;biome-A-5&quot;, label: &quot;欧亚草原&quot;, kind: &quot;biome&quot;, ring: &quot;A&quot;, index: 5 },
    { id: &quot;biome-B-0&quot;, label: &quot;新斯科舍 · 长池&quot;, kind: &quot;biome&quot;, ring: &quot;B&quot;, index: 0 },
    { id: &quot;biome-B-7&quot;, label: &quot;哥斯达黎加雨林&quot;, kind: &quot;biome&quot;, ring: &quot;B&quot;, index: 7 },
    { id: &quot;biome-B-5&quot;, label: &quot;索诺拉沙漠&quot;, kind: &quot;biome&quot;, ring: &quot;B&quot;, index: 5 },
  ];

  function resolveParent(loc) {
    if (loc.kind === &quot;spine&quot;) return spine;
    if (loc.kind === &quot;spoke&quot;) return spokeGroups[loc.ring][loc.k];
    return biomeGroups[loc.ring][loc.index];
  }

  function orientCamera(loc) {
    const parent = resolveParent(loc);
    parent.attach(camera);
    if (loc.kind === &quot;biome&quot;) {
      camera.position.set(0, -1.0, -0.435);
      const target = new THREE.Vector3(0, 1.5, -0.45);
      const up = new THREE.Vector3(0, 0, 1);
      setCameraBasis(camera.position, target, up);
    } else if (loc.kind === &quot;spoke&quot;) {
      camera.position.set(0, loc.y, 0);
      const target = new THREE.Vector3(0, loc.y + 1, 0);
      const up = new THREE.Vector3(0, 0, 1);
      setCameraBasis(camera.position, target, up);
    } else {
      camera.position.set(loc.pos[0], loc.pos[1], loc.pos[2]);
      const target = new THREE.Vector3(loc.target[0], loc.target[1], loc.target[2]);
      const up = new THREE.Vector3(0, 1, 0);
      setCameraBasis(camera.position, target, up);
    }
  }

  function setCameraBasis(pos, target, up) {
    const f = target.clone().sub(pos).normalize();
    const right = new THREE.Vector3().crossVectors(f, up).normalize();
    const u = new THREE.Vector3().crossVectors(right, f).normalize();
    camera.quaternion.setFromRotationMatrix(
      new THREE.Matrix4().makeBasis(right, u, f.clone().negate())
    );
  }

  function enterInterior(id) {
    const loc = INTERIOR.find(l =&gt; l.id === id) || id;
    orientCamera(loc);
    controls.enabled = false;
    controls.autoRotate = false;
    document.getElementById(&quot;aurora-auto-btn&quot;).setAttribute(&quot;aria-pressed&quot;, &quot;false&quot;);
    document.getElementById(&quot;aurora-auto-btn&quot;).textContent = &quot;自动环绕&quot;;
    document.getElementById(&quot;aurora-mode-interior&quot;).classList.add(&quot;active&quot;);
    document.getElementById(&quot;aurora-mode-exterior&quot;).classList.remove(&quot;active&quot;);
    document.getElementById(&quot;aurora-back-btn&quot;).hidden = false;
    document.getElementById(&quot;aurora-locations&quot;).hidden = false;
    document.getElementById(&quot;aurora-pick-card&quot;).hidden = true;
    hintEl.textContent = &quot;拖动转动视角 · W/A/S/D 移动 · Q/E 升降 · 滚轮缩放视野&quot;;
    cameraLight.intensity = 0.9;
    for (const hull of hullMeshes) hull.material.opacity = 0.45;
    if (loc.kind === &quot;biome&quot;) {
      biomeGroups[loc.ring][loc.index].userData.hull.material.opacity = 1;
    }
  }

  function exitInterior() {
    scene.attach(camera);
    camera.position.set(24, 13, 14);
    controls.target.set(0, 0, 0);
    controls.enabled = true;
    controls.update();
    document.getElementById(&quot;aurora-mode-exterior&quot;).classList.add(&quot;active&quot;);
    document.getElementById(&quot;aurora-mode-interior&quot;).classList.remove(&quot;active&quot;);
    document.getElementById(&quot;aurora-back-btn&quot;).hidden = true;
    document.getElementById(&quot;aurora-locations&quot;).hidden = true;
    document.getElementById(&quot;aurora-pick-card&quot;).hidden = true;
    hintEl.textContent = &quot;拖动旋转 · 滚轮缩放 · 右键平移 · 点击生态舱查看详情&quot;;
    cameraLight.intensity = 1.7;
    for (const hull of hullMeshes) hull.material.opacity = 0.62;
    currentBiomeLoc = null;
  }

  // 把每个生态舱的 hull 引用存进 group，供进入时置为不透明
  for (const ringId of [&quot;A&quot;, &quot;B&quot;]) {
    for (let i = 0; i &lt; 12; i++) {
      biomeGroups[ringId][i].userData.hull = hullMeshes.find(h =&gt; h.userData.ring === ringId &amp;&amp; h.userData.index === i);
    }
  }

  let currentBiomeLoc = null;
  const modeInteriorBtn = document.getElementById(&quot;aurora-mode-interior&quot;);
  const modeExteriorBtn = document.getElementById(&quot;aurora-mode-exterior&quot;);
  const backBtn = document.getElementById(&quot;aurora-back-btn&quot;);
  const autoBtn = document.getElementById(&quot;aurora-auto-btn&quot;);
  const resetBtn = document.getElementById(&quot;aurora-reset-btn&quot;);
  const specToggle = document.getElementById(&quot;aurora-spec-toggle&quot;);
  const specPanel = document.getElementById(&quot;aurora-spec-panel&quot;);
  const pickCard = document.getElementById(&quot;aurora-pick-card&quot;);
  const locationsEl = document.getElementById(&quot;aurora-locations&quot;);

  modeInteriorBtn.addEventListener(&quot;click&quot;, () =&gt; enterInterior(&quot;bridge&quot;));
  modeExteriorBtn.addEventListener(&quot;click&quot;, exitInterior);
  backBtn.addEventListener(&quot;click&quot;, exitInterior);
  autoBtn.addEventListener(&quot;click&quot;, () =&gt; {
    if (controls.enabled) {
      controls.autoRotate = !controls.autoRotate;
      autoBtn.setAttribute(&quot;aria-pressed&quot;, String(controls.autoRotate));
      autoBtn.textContent = controls.autoRotate ? &quot;自动环绕 ✓&quot; : &quot;自动环绕&quot;;
    }
  });
  resetBtn.addEventListener(&quot;click&quot;, () =&gt; {
    if (!controls.enabled) { exitInterior(); }
    camera.position.set(24, 13, 14);
    controls.target.set(0, 0, 0);
    controls.update();
  });
  specToggle.addEventListener(&quot;click&quot;, () =&gt; {
    const show = specPanel.hidden;
    specPanel.hidden = !show;
    specToggle.setAttribute(&quot;aria-expanded&quot;, String(show));
    specToggle.classList.toggle(&quot;open&quot;, show);
  });

  // 内部地点按钮
  for (const loc of INTERIOR) {
    const b = document.createElement(&quot;button&quot;);
    b.type = &quot;button&quot;;
    b.textContent = loc.label;
    b.addEventListener(&quot;click&quot;, () =&gt; enterInterior(loc.id));
    locationsEl.appendChild(b);
  }

  // 时间倍率
  let timeScale = 8;
  for (const btn of document.querySelectorAll(&quot;[data-ts]&quot;)) {
    btn.addEventListener(&quot;click&quot;, () =&gt; {
      timeScale = Number(btn.dataset.ts);
      document.querySelectorAll(&quot;[data-ts]&quot;).forEach(x =&gt; x.classList.toggle(&quot;active&quot;, x === btn));
    });
  }

  // ---------- 射线拾取（点击生态舱） ----------
  const raycaster = new THREE.Raycaster();
  const pointer = new THREE.Vector2();
  let hoverHull = null;
  let downX = 0, downY = 0;

  renderer.domElement.addEventListener(&quot;pointerdown&quot;, e =&gt; { downX = e.clientX; downY = e.clientY; });
  renderer.domElement.addEventListener(&quot;pointerup&quot;, e =&gt; {
    if (Math.hypot(e.clientX - downX, e.clientY - downY) &gt; 5) return;
    if (!controls.enabled) return;
    pickAt(e.clientX, e.clientY, true);
  });
  renderer.domElement.addEventListener(&quot;pointermove&quot;, e =&gt; {
    if (controls.enabled) {
      pointer.x = (e.clientX / renderer.domElement.clientWidth) * 2 - 1;
      pointer.y = -(e.clientY / renderer.domElement.clientHeight) * 2 + 1;
      pickAt(e.clientX, e.clientY, false);
    }
  });

  function pickAt(clientX, clientY, click) {
    const rect = renderer.domElement.getBoundingClientRect();
    pointer.x = ((clientX - rect.left) / rect.width) * 2 - 1;
    pointer.y = -((clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(pointer, camera);
    const hits = raycaster.intersectObjects(hullMeshes, false);
    const hit = hits[0];
    if (!click) {
      const target = hit ? hit.object : null;
      if (hoverHull &amp;&amp; hoverHull !== target) setHover(hoverHull, false);
      if (target) setHover(target, true);
      hoverHull = target;
      wrap.style.cursor = hit ? &quot;pointer&quot; : &quot;grab&quot;;
      return;
    }
    if (!hit) {
      pickCard.hidden = true;
      return;
    }
    const d = hit.object.userData;
    const def = d.def;
    document.getElementById(&quot;aurora-pick-name&quot;).textContent = def.name;
    document.getElementById(&quot;aurora-pick-en&quot;).textContent = def.en + (d.ring === &quot;A&quot; ? &quot; · A 环（旧世界）&quot; : &quot; · B 环（新世界）&quot;);
    document.getElementById(&quot;aurora-pick-desc&quot;).textContent = def.desc;
    pickCard.hidden = false;
    currentBiomeLoc = { kind: &quot;biome&quot;, ring: d.ring, index: d.index, label: def.name };
  }

  function setHover(obj, on) {
    obj.material.emissive.setHex(on ? 0x1d3a66 : 0x06090f);
    obj.material.emissiveIntensity = on ? 1 : 1;
  }

  document.getElementById(&quot;aurora-pick-enter&quot;).addEventListener(&quot;click&quot;, () =&gt; {
    if (currentBiomeLoc) enterInterior(currentBiomeLoc);
  });

  // ---------- 内部飞行控制 ----------
  const keys = {};
  window.addEventListener(&quot;keydown&quot;, e =&gt; { keys[e.code] = true; if ([&quot;KeyW&quot;,&quot;KeyA&quot;,&quot;KeyS&quot;,&quot;KeyD&quot;,&quot;KeyQ&quot;,&quot;KeyE&quot;].includes(e.code)) e.preventDefault(); });
  window.addEventListener(&quot;keyup&quot;, e =&gt; { keys[e.code] = false; });

  let lookDragging = false;
  let lastX = 0, lastY = 0;
  renderer.domElement.addEventListener(&quot;pointerdown&quot;, e =&gt; {
    if (!controls.enabled) {
      lookDragging = true;
      lastX = e.clientX; lastY = e.clientY;
      renderer.domElement.setPointerCapture(e.pointerId);
    }
  });
  renderer.domElement.addEventListener(&quot;pointermove&quot;, e =&gt; {
    if (lookDragging &amp;&amp; !controls.enabled) {
      const dx = e.clientX - lastX;
      const dy = e.clientY - lastY;
      lastX = e.clientX; lastY = e.clientY;
      camera.rotateY(-dx * 0.0028);
      camera.rotateX(-dy * 0.0028);
      camera.rotation.x = THREE.MathUtils.clamp(camera.rotation.x, -1.45, 1.45);
    }
  });
  renderer.domElement.addEventListener(&quot;pointerup&quot;, () =&gt; { lookDragging = false; });
  renderer.domElement.addEventListener(&quot;wheel&quot;, e =&gt; {
    if (!controls.enabled) {
      e.preventDefault();
      camera.fov = THREE.MathUtils.clamp(camera.fov + e.deltaY * 0.025, 32, 95);
      camera.updateProjectionMatrix();
    }
  }, { passive: false });

  function clampInterior() {
    const p = camera.position;
    if (camera.parent === spine) {
      const rho = Math.hypot(p.x, p.y);
      if (rho &gt; 0.26) { p.x *= 0.26 / rho; p.y *= 0.26 / rho; }
      p.z = THREE.MathUtils.clamp(p.z, -4.85, 4.72);
    } else if (camera.parent.userData &amp;&amp; camera.parent.userData.biome) {
      const rho = Math.hypot(p.x, p.z);
      if (rho &gt; 0.455) { p.x *= 0.455 / rho; p.z *= 0.455 / rho; }
      if (rho &lt; 0.08) { p.x *= 0.08 / rho; p.z *= 0.08 / rho; }
      p.y = THREE.MathUtils.clamp(p.y, -1.92, 1.92);
      p.z = THREE.MathUtils.clamp(p.z, -0.458, 0.32);
      p.x = THREE.MathUtils.clamp(p.x, -0.44, 0.44);
    } else {
      // 辐条电梯
      const rho = Math.hypot(p.x, p.z);
      if (rho &gt; 0.045) { p.x *= 0.045 / rho; p.z *= 0.045 / rho; }
      p.y = THREE.MathUtils.clamp(p.y, 0.6, 7.35);
    }
  }

  function moveCamera(dt) {
    if (controls.enabled) return;
    const speed = 0.14 * (keys.ShiftLeft || keys.ShiftRight ? 3 : 1);
    const parent = camera.parent;
    const isSpine = parent === spine;
    const localUp = isSpine ? new THREE.Vector3(0, 1, 0) : new THREE.Vector3(0, 0, 1);
    const wpos = camera.getWorldPosition(new THREE.Vector3());
    const worldForward = camera.getWorldDirection(new THREE.Vector3());
    const toLocal = (v) =&gt; parent.worldToLocal(v.clone().add(wpos)).sub(parent.worldToLocal(wpos.clone())).normalize();
    const f = toLocal(worldForward).multiplyScalar(speed * dt);
    const right = new THREE.Vector3().crossVectors(f.clone().normalize(), localUp).normalize().multiplyScalar(speed * dt);
    const up = localUp.clone().multiplyScalar(speed * dt);
    const d = new THREE.Vector3();
    if (keys.KeyW || keys.ArrowUp) d.add(f);
    if (keys.KeyS || keys.ArrowDown) d.sub(f);
    if (keys.KeyD || keys.ArrowRight) d.add(right);
    if (keys.KeyA || keys.ArrowLeft) d.sub(right);
    if (keys.KeyE) d.add(up);
    if (keys.KeyQ) d.sub(up);
    camera.position.add(d);
    clampInterior();
  }

  // ---------- 尺寸适配 ----------
  function resize() {
    const w = wrap.clientWidth, h = wrap.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  const ro = new ResizeObserver(resize);
  ro.observe(wrap);
  resize();

  // ---------- 主循环 ----------
  const clock = new THREE.Clock();
  let frames = 0, fpsTime = 0, fps = 0;

  function animate() {
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05);
    const t = clock.elapsedTime;

    // 环反向旋转
    if (timeScale &gt; 0) {
      ship.children.forEach(child =&gt; {
        if (child.userData.spinSign) child.rotation.z += child.userData.spinSign * OMEGA * timeScale * dt;
      });
    }

    // 深空航行：星点与星痕向后流动
    const starSpeed = 26 * timeScale;
    const zArr = stars.geometry.attributes.position.array;
    for (let i = 0; i &lt; STAR_N; i++) {
      let z = zArr[i * 3 + 2] - starSpeed * dt;
      if (z &lt; -1200) z += 2400;
      zArr[i * 3 + 2] = z;
    }
    stars.geometry.attributes.position.needsUpdate = true;

    const streakSpeed = 150 * timeScale;
    const sArr = streaks.geometry.attributes.position.array;
    for (let i = 0; i &lt; STREAK_N; i++) {
      let z = sArr[i * 6 + 2] - streakSpeed * dt;
      if (z &lt; -1300) z += 2600;
      sArr[i * 6 + 2] = z;
      sArr[i * 6 + 5] = z + 8 + ((i * 37) % 30);
    }
    streaks.geometry.attributes.position.needsUpdate = true;
    dust.rotation.z += dt * 0.012;
    dust.rotation.x += dt * 0.007;

    // 聚变脉冲（“每秒两次的微型聚变弹”）
    if (t &gt; nextPulse) {
      pulseStart = t;
      nextPulse = t + 0.48 + Math.random() * 0.08;
    }
    const sincePulse = t - pulseStart;
    const flash = Math.exp(-sincePulse * 5.5);
    engineLight.intensity = flash * 8;
    plume.material.opacity = 0.1 + flash * 0.42;
    plume.scale.setScalar(0.8 + flash * 0.45);
    for (const rim of bells) rim.material.color.setHex(flash &gt; 0.15 ? 0xffc06a : 0xff8a3c);

    // 航行灯闪烁
    navL.material.opacity = 0.35 + 0.65 * (Math.sin(t * 2.4) &gt; 0 ? 1 : 0);
    navR.material.opacity = 0.35 + 0.65 * (Math.sin(t * 2.4 + Math.PI) &gt; 0 ? 1 : 0);

    // 电梯轿厢沿辐条往复
    for (const cab of cabinMeshes) {
      let y = cab.userData.phase + t * 0.16 * Math.max(timeScale, 0.001) * cab.userData.dir;
      y = ((y % 14) + 14) % 14;
      if (y &gt; 7.3) y = 14 - y;
      cab.position.y = THREE.MathUtils.clamp(y, 0.5, 7.1);
    }

    // AI 核心粒子
    const ap = aiParticles.geometry.attributes.position.array;
    for (let i = 0; i &lt; 120; i++) {
      let y = ap[i * 3 + 1] + dt * 0.05;
      if (y &gt; 0.5) y -= 1.0;
      ap[i * 3 + 1] = y;
    }
    aiParticles.geometry.attributes.position.needsUpdate = true;

    moveCamera(dt);
    controls.update();
    renderer.render(scene, camera);

    frames++;
    fpsTime += dt;
    if (fpsTime &gt;= 1) {
      fps = frames / fpsTime;
      frames = 0; fpsTime = 0;
    }
  }
  animate();

  window.__aurora = { ready: true, fps: () =&gt; fps, debug: { scene, ship, spine, camera } };
  showToast(&quot;点击生态舱查看详情，或选择「内部探索」进入船舱&quot;, 4200);
})();
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-lucide&quot; async src=&quot;https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;
