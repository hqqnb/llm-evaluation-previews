<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3D 双时区腕表 · Dual-Time Watch</title>
  <style>
    :root {
      --bg: #0a0d14;
      --panel: rgba(14, 18, 29, 0.78);
      --border: rgba(255, 255, 255, 0.09);
      --text: #e8edf7;
      --muted: #9aa7bd;
      --gold: #ffd98a;
      --blue: #8fb4ff;
      --red: #ff7a7a;
      --green: #7be2a5;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: "SF Pro Display", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    }
    #stage { position: fixed; inset: 0; }
    #stage canvas { display: block; }

    .hud {
      position: fixed;
      z-index: 10;
      pointer-events: auto;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 10px 32px rgba(0, 0, 0, 0.35);
    }

    header.hud {
      top: 20px;
      left: 22px;
      user-select: none;
    }
    header h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    header .sub {
      margin: 4px 0 0;
      font-size: 12.5px;
      color: var(--muted);
    }

    .digital {
      top: 20px;
      right: 22px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-width: 236px;
    }
    .digi-row { line-height: 1.35; }
    .digi-row.accent .digi-clock { color: var(--blue); }
    .digi-name {
      font-size: 12px;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }
    .digi-name .tz-name { color: var(--gold); max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .digi-clock {
      font-size: 26px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      letter-spacing: 1px;
    }
    .digi-date { font-size: 12.5px; color: var(--text); }
    .digi-off { font-size: 11.5px; color: var(--muted); }

    .controls {
      bottom: 22px;
      left: 22px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 430px;
    }
    .controls label {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 12px;
      color: var(--muted);
    }
    .controls select {
      background: rgba(255, 255, 255, 0.07);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 9px;
      font-size: 13px;
      max-width: 400px;
    }
    .controls select option { background: #141a28; color: var(--text); }
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      align-items: center;
    }
    button {
      font: inherit;
      font-size: 12.5px;
      color: var(--text);
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 11px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    button:hover { background: rgba(255, 255, 255, 0.12); }
    button.active {
      background: rgba(255, 217, 138, 0.14);
      border-color: rgba(255, 217, 138, 0.55);
      color: var(--gold);
    }

    .hint {
      bottom: 22px;
      right: 22px;
      font-size: 12px;
      color: var(--muted);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 12px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      user-select: none;
    }

    #error-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(8, 10, 16, 0.94);
      color: var(--red);
      padding: 40px;
      font-size: 16px;
      line-height: 1.7;
    }

    #test-panel {
      position: fixed;
      z-index: 50;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: min(560px, calc(100vw - 32px));
      max-height: calc(100vh - 120px);
      overflow: auto;
      background: rgba(12, 16, 26, 0.94);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 18px;
      font-size: 13px;
      line-height: 1.7;
    }
    #test-panel.done { border-color: rgba(123, 226, 165, 0.5); }
    #test-summary { font-weight: 600; margin-bottom: 6px; color: var(--gold); }
    .test-line.ok { color: var(--green); }
    .test-line.fail { color: var(--red); }

    @media (max-width: 720px) {
      header.hud { top: 12px; left: 14px; }
      header h1 { font-size: 17px; }
      .digital { top: 12px; right: 14px; min-width: 200px; padding: 10px 12px; }
      .digi-clock { font-size: 21px; }
      .controls { bottom: 12px; left: 14px; right: 14px; max-width: none; }
      .hint { display: none; }
    }
  </style>
</head>
<body>
  <div id="stage" aria-label="3D 双时区腕表渲染区域"></div>
  <div id="error-overlay" role="alert"></div>

  <header class="hud">
    <h1>3D 双时区腕表</h1>
    <p class="sub">Dual-Time Automatic · 按当前时间实时运行，秒针平滑扫动</p>
  </header>

  <section class="hud panel digital" aria-label="两个时区的数字时间">
    <div class="digi-row">
      <div class="digi-name">主表盘 <span class="tz-name" id="name-tz1"></span></div>
      <div class="digi-clock" id="clock-tz1">--:--:--</div>
      <div class="digi-date" id="date-tz1">加载中…</div>
      <div class="digi-off" id="offset-tz1"></div>
    </div>
    <div class="digi-row accent">
      <div class="digi-name">小表盘（第二时区） <span class="tz-name" id="name-tz2"></span></div>
      <div class="digi-clock" id="clock-tz2">--:--:--</div>
      <div class="digi-date" id="date-tz2">加载中…</div>
      <div class="digi-off" id="offset-tz2"></div>
    </div>
  </section>

  <section class="hud panel controls" aria-label="腕表控制">
    <label>
      主表盘时区（时分秒指针 / 日期窗口）
      <select id="sel-tz1"></select>
    </label>
    <label>
      小表盘时区（6 点位置第二时区）
      <select id="sel-tz2"></select>
    </label>
    <div class="row">
      <button type="button" data-speed="1">1×</button>
      <button type="button" data-speed="60">60×</button>
      <button type="button" data-speed="600">600×</button>
      <button type="button" data-speed="3600">3600×</button>
      <button type="button" id="btn-pause">暂停</button>
      <button type="button" id="btn-autorotate">自动旋转</button>
      <button type="button" id="btn-reset">复位视角</button>
    </div>
  </section>

  <footer class="hud hint">拖拽旋转 · 滚轮缩放 · 右键平移 · 左下角可切换时区与倍速</footer>

  <div id="test-panel" hidden>
    <div id="test-summary">自检运行中…</div>
  </div>

  <script src="vendor/three.min.js"></script>
  <script src="vendor/OrbitControls.js"></script>
  <script src="js/core.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
